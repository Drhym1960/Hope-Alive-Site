# Render Blueprint for Hope-Alive-Site (www.hacsfoundation.com).
# Matches the existing web service name so applying this Blueprint updates
# that service instead of creating a second one.
services:
  - type: web
    name: Hope-Alive-Site
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
