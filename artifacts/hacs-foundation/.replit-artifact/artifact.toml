kind = "web"
previewPath = "/"
title = "Hope Alive Children Spring Foundation"
version = "1.0.0"
id = "artifacts/hacs-foundation"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24970

[services.development]
run = "pnpm --filter @workspace/hacs-foundation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hacs-foundation", "run", "build" ]
publicDir = "artifacts/hacs-foundation/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24970"
BASE_PATH = "/"
